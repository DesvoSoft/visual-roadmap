<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Roadmap · Progress Tracker</title>
  <meta name="description" content="Live roadmap and progress tracker for independent coding agents">

  <!-- Google Fonts: Space/Sci-Fi + UI + Monospace -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>

<div id="app" class="app-layout awaiting-roadmap">

  <!-- ── 1. Left Sidebar Rail ──── -->
  <aside class="rail" id="sidebar-rail" aria-label="Primary navigation">
    <div class="rail__top-accent"></div>

    <div class="rail__brand" title="Visual Roadmap">
      <div class="rail__brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </div>
      <span class="rail__brand-text" id="rail-brand-name">ROADMAP</span>
    </div>

    <nav class="rail__nav">
      <!-- Seguimiento -->
      <button class="rail__btn rail__btn--active" data-view="timeline" id="btn-nav-timeline" title="Progress tracker">
        <div class="rail__btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="16" y2="12"></line>
            <line x1="4" y1="18" x2="11" y2="18"></line>
            <polyline points="15 15 18 18 15 21"></polyline>
          </svg>
        </div>
        <span class="rail__btn-label" data-i18n="tracking">TRACKING</span>
      </button>

      <!-- Versions -->
      <button class="rail__btn" data-view="board" id="btn-nav-board" title="Versions and deliverables">
        <div class="rail__btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="5" height="18" rx="1"></rect>
            <rect x="10" y="3" width="5" height="12" rx="1"></rect>
            <rect x="17" y="3" width="5" height="15" rx="1"></rect>
          </svg>
        </div>
        <span class="rail__btn-label" data-i18n="versions">VERSIONS</span>
      </button>
    </nav>

    <!-- Bottom Rail item (Notas / Log) -->
    <div class="rail__bottom">
      <button class="rail__btn" data-view="log" id="btn-nav-log" title="Notes and decisions">
        <div class="rail__btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </div>
        <span class="rail__btn-label" data-i18n="notes">NOTES</span>
      </button>
    </div>
  </aside>

  <!-- ── 2. Main Workspace ─────────────────────────────── -->
  <div class="workspace">

    <!-- Header Section -->
    <header class="hud-header">
      <div class="hud-header__top">
        <div class="hud-header__crumbs">
          <span class="hud-header__crumb-project" id="crumb-project">ROADMAP</span>
          <span class="hud-header__crumb-sep">·</span>
          <span class="hud-header__crumb-page" data-i18n="roadmap">ROADMAP</span>
          <span class="connection-status" id="live-indicator" aria-live="polite"><span class="connection-status__dot"></span><span id="connection-text">Disconnected</span></span>
        </div>

        <div class="hud-header__meta">
          <span class="hud-header__updated" id="header-updated"></span>
          <span class="hud-header__filename" id="file-name" title="Archivo activo"></span>
          <select id="language-select" class="preference-select" aria-label="Interface language"><option value="en">EN</option><option value="es">ES</option></select>
          <button id="notify-toggle" class="preference-button" type="button" aria-pressed="false" hidden>🔕</button>
          <button id="theme-toggle" class="preference-button" type="button" aria-label="Toggle color theme">☀</button>
          <button class="btn-pick" id="btn-pick" title="Open local ROADMAP.md"><span data-i18n="open">Open</span></button>
        </div>
      </div>

      <div class="hud-header__title-row">
        <h1 class="hud-header__title" id="page-title" data-i18n="progress">PROGRESS TRACKER</h1>
      </div>

      <!-- Quick Metrics Bar -->
      <div class="hud-metrics-bar">
        <span class="m-item"><span data-i18n="version">Version</span> <strong id="m-version"></strong></span>
        <span class="m-item"><span data-i18n="phase">Phase</span> <strong id="m-phase"></strong> <span data-i18n="of">of</span> <span id="m-phase-total"></span></span>
        <span class="m-item"><strong id="m-tasks-done"></strong>/<span id="m-tasks-total"></span> <span data-i18n="tasks">tasks</span></span>
        <span class="m-item"><strong id="m-tests"></strong> tests</span>
        <span class="m-item"><strong id="m-e2e"></strong> e2e</span>
        <span class="m-item"><strong id="m-decisions"></strong> <span data-i18n="decisions">decisions</span></span>
        <span class="m-item"><strong id="m-lines"></strong> <span data-i18n="lines">lines</span></span>
        <span class="m-item"><span data-i18n="lastCommit">last commit</span> <code id="m-commit"></code> <span id="m-commit-time"></span></span>
      </div>
    </header>

    <!-- ── 3. Mission Control HUD (3-Column Card) ──────── -->
    <section class="hud-panel" aria-label="Progress overview">
      <div class="hud-panel__corner hud-panel__corner--tl"></div>
      <div class="hud-panel__corner hud-panel__corner--tr"></div>
      <div class="hud-panel__corner hud-panel__corner--bl"></div>
      <div class="hud-panel__corner hud-panel__corner--br"></div>

      <!-- Col 1: AHORA MISMO · EN CURSO -->
      <div class="hud-card hud-card--now">
        <div class="hud-card__head-label" data-i18n="now">CURRENT TASK</div>
        <div class="hud-card__now-title">
          <span class="hud-card__now-id" id="now-id"></span>
          <span class="hud-card__now-name" id="now-name"></span>
        </div>
        <div class="hud-card__now-context" id="now-context"></div>

        <div class="hud-card__now-times">
          <span><span data-i18n="expected">Expected</span>: <strong id="now-expected"></strong></span>
          <span><span data-i18n="elapsed">Elapsed</span>: <strong id="now-elapsed"></strong></span>
          <span class="hud-card__now-warn" id="now-warn"></span>
        </div>
        <div class="hud-card__now-times"><span id="now-forecast-label">Agent ETA</span>: <strong id="now-eta"></strong></div>
        <div class="hud-card__now-context" id="now-reason"></div>

        <div class="hud-card__now-track">
          <div class="hud-card__now-fill" id="now-fill" style="width: 0;"></div>
        </div>
      </div>

      <!-- Col 2: PROJECT & CADENCE ESTIMATES -->
      <div class="hud-card hud-card--stats">
        <div class="hud-card__phase-title" id="phase-title"></div>
        <div class="hud-card__pct-row">
          <span class="hud-card__pct" id="phase-pct"></span>
          <span class="hud-card__tasks-count" id="phase-tasks"></span>
        </div>

        <div class="hud-card__phase-track">
          <div class="hud-card__phase-fill" id="phase-fill" style="width: 0;"></div>
        </div>

        <div class="hud-card__meta-list">
          <div class="hud-card__meta-row">
            <span class="hud-card__meta-label" data-i18n="phasesDone">Phases completed</span>
            <strong class="hud-card__meta-val" id="phase-done-cnt"></strong>
          </div>
          <div class="hud-card__meta-row">
            <span class="hud-card__meta-label" data-i18n="calculatedDelivery">Projected delivery</span>
            <strong class="hud-card__meta-val" id="phase-eta"></strong>
          </div>
          <div class="hud-card__meta-row">
            <span class="hud-card__meta-label" data-i18n="pace">Observed pace</span>
            <strong class="hud-card__meta-val" id="phase-pace"></strong>
          </div>
          <div class="hud-card__meta-row">
            <span class="hud-card__meta-label" data-i18n="since">In development since</span>
            <strong class="hud-card__meta-val" id="phase-started"></strong>
          </div>
        </div>
      </div>

      <!-- Col 3: ÚLTIMOS CAMBIOS -->
      <div class="hud-card hud-card--changes">
        <div class="hud-card__head-label" data-i18n="recentChanges">RECENT CHANGES</div>
        <div class="hud-card__changes-list" id="changes-list"></div>
        <div class="hud-card__head-label" style="margin-top: 12px;" data-i18n="etaChanges">ETA CHANGES</div>
        <div class="hud-card__changes-list" id="estimate-history"></div>
      </div>
    </section>

    <div class="forecast-note" id="forecast-note"></div>
    <section class="health" id="health" aria-live="polite" hidden></section>

    <!-- ── 4. Main Viewport (Timeline / Deliverables / Board) ─ -->
    <main id="main-view" class="main-viewport" role="main">
      <!-- Inyectado por app.js / timeline.js / board.js -->
    </main>

  </div><!-- /.workspace -->

</div><!-- /#app -->

<!-- Scripts -->
<script src="md.js"></script>
<script src="ui.js"></script>
<script src="forecast.js"></script>
<script src="watcher.js"></script>
<script src="timeline.js"></script>
<script src="board.js"></script>
<script src="log.js"></script>
<script src="app.js"></script>

</body>
</html>
