<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Visual Roadmap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b4ff"/>
      <stop offset="1" stop-color="#5fe1ff"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="30" fill="url(#bg)" stroke="#1d3a57" stroke-width="2"/>
  <!-- three stacked layers: planned, in progress, done -->
  <polyline points="36,98 80,120 124,98" fill="none" stroke="#2a5577" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="36,78 80,100 124,78" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="80,36 124,58 80,80 36,58" fill="#ff7a00" stroke="#ff9a3c" stroke-width="4" stroke-linejoin="round"/>
  <!-- the "now" marker -->
  <line x1="80" y1="24" x2="80" y2="136" stroke="#ff7a00" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round" opacity=".55"/>
</svg>
